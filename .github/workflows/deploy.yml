name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當你 push 到 main 分支時觸發自動編譯

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build # 執行打包

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 將 Vite 打包出來的 dist 資料夾上傳到 Pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4